name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Advisory only: the codebase currently has 22 pre-existing eslint errors
      # and ~579 warnings, so this must not block merges yet. Remove
      # continue-on-error once those are cleaned up to make lint a hard gate.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
